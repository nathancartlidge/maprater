[project]
name = "maprater"
version = "1.0.0"
description = "Overwatch Map Rating (Data Entry) Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite~=0.20.0",
    "discord.py>=2.6.4",
    "matplotlib~=3.9.2",
    "numpy~=2.1.2",
    "pandas~=2.2.3",
    "python-dateutil~=2.8.2",
    "python-dotenv~=0.21.0",
    "requests~=2.32.3",
    "seaborn~=0.12.0",
]



[tool.uv]
package = true

[dependency-groups]
ocr = [
    "opencv-python-headless~=4.11.0.86",
]

[project.scripts]
maprater = "maprater.__main__:run_args"
